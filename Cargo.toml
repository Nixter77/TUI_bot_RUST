[package]
name = "tui-bot"
version = "0.1.0"
edition = "2021"
description = "Binance USDT-M futures TestNet TUI trader"
license = "MIT"
default-run = "tui-bot"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
hex = "0.4"
hmac = "0.12"
regex = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
